baseURL = 'https://example.org/'
defaultContentLanguage = "pt-br"
theme = 'LoveIt'
title = "Raphael Nascimneto"

enableGitInfo = true
enableEmoji = true

# Pagination config
[pagination]
  disableAliases = false
  pagerSize = 10
  path = "page"

[params]
    # site default theme ["auto", "light", "dark"]
    defaultTheme = "auto"
    # public git repo url only then enableGitInfo is true
    gitRepo = ""
    # which hash function used for SRI, when empty, no SRI is used
    # ["sha256", "sha384", "sha512", "md5"]
    fingerprint = ""
    # date format
    dateFormat = "2006-01-02"
    # website title for Open Graph and Twitter Cards
    title = "Raphael Nascimento"
    # website description for RSS, SEO, Open Graph and Twitter Cards
    description = "Esse é o meu site perssoal"
    # website images for Open Graph and Twitter Cards
    images = ["/logo.svg"]

# Header config
[params.header]
    # desktop header mode ["fixed", "normal", "auto"]
    desktopMode = "fixed"
    # mobile header mode ["fixed", "normal", "auto"]
    mobileMode = "auto"
    # LoveIt NEW | 0.2.0 Header title config

[params.header.title]
    # URL of the LOGO
    logo = ""
    # title name
    name = "Raphael Nascimento"
    # whether to use typeit animation for title name
    typeit = false

# Author config
[params.author]
name = "Raphael"
email = ""
link = ""

# Footer config
  [params.footer]
    enable = true
    # Custom content (HTML format is supported)
    custom = ""
    # whether to show Hugo and theme info
    hugo = true
    # whether to show copyright info
    copyright = true
    # whether to show the author
    author = true
    # site creation time
    since = 2019
    # ICP info only in China (HTML format is supported)
    icp = ""
    # license info (HTML format is supported)
    license= '<a rel="license external nofollow noopener noreffer" href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC 4.0</a>'

# Section (all posts) page config
[params.section]
# special amount of posts in each section page
paginate = 20
# date format (month and day)
dateFormat = "01-02"
# amount of RSS pages
rss = 10



# Home page config
[params.home]
    # amount of RSS pages
    rss = 10

# Home page profile
[params.home.profile]
    enable = true
    # Gravatar Email for preferred avatar in home page
    gravatarEmail = ""
    # URL of avatar shown in home page
    avatarURL = "/img/avatar-528x560.png"
    # subtitle shown in home page (HTML format is supported)
    subtitle = "Este é o meu site pessoal. Posto algumas coisinhas que venho estudando!"
    # whether to use typeit animation for subtitle
    typeit = true
    # whether to show social links
    social = true

# Home page posts
[params.home.posts]
    enable = true
    # special amount of posts in each home posts page
    paginate = 6
    defaultHiddenFromHomePage = false

[params.social]
    github = 'https://github.com/raphael720'
    email = 'raphaelleite720@gmail.com'
    linkedin = 'https://www.linkedin.com/in/raphael-nascimento-511b09148/'
    twitter = 'https://x.com/Raphael_720'

# App icon config
[params.app]
    # optional site title override for the app when added to an iOS home screen or Android launcher
    title = "site"
    # whether to omit favicon resource links
    noFavicon = false
    # modern SVG favicon to use in place of older style .png and .ico files
    svgFavicon = "/logo.svg"
    # Android browser theme color
    themeColor = "#ffffff"
    # Safari mask icon color
    iconColor = "#5bbad5"
    # Windows v8-10 tile color
    tileColor = "#da532c"

# Page global config
[params.page]
    # whether to hide a page from home page
    hiddenFromHomePage = false
    # whether to hide a page from search results
    hiddenFromSearch = false
    # whether to enable twemoji
    twemoji = false
    # whether to enable lightgallery
    lightgallery = false
    # whether to enable the ruby extended syntax
    ruby = true
    # whether to enable the fraction extended syntax
    fraction = true
    # whether to enable the fontawesome extended syntax
    fontawesome = true
    # whether to show link to Raw Markdown content of the content
    linkToMarkdown = true
    # LoveIt NEW | 0.2.4 whether to show the full text content in RSS
    rssFullText = false

# Table of the contents config
[params.page.toc]
    # whether to enable the table of the contents
    enable = true
    # whether to keep the static table of the contents in front of the post
    keepStatic = false
    # whether to make the table of the contents in the sidebar automatically collapsed
    auto = true

# LoveIt CHANGED | 0.2.0 KaTeX mathematical formulas
[params.page.math]
    enable = true
    # KaTeX extension copy_tex
    copyTex = true
    # KaTeX extension mhchem
    mhchem = true

# LoveIt NEW | 0.2.0 Code config
[params.page.code]
    # whether to show the copy button of the code block
    copy = true
    # the maximum number of lines of displayed code by default
    maxShownLines = 50

# Menu config
[menu]
    [[menu.main]]
        weight = 1
        identifier = "posts"
        # you can add extra information before the name (HTML format is supported), such as icons
        pre = ""
        # you can add extra information after the name (HTML format is supported), such as icons
        post = ""
        name = "Blog"
        url = "/posts/"
        # title will be shown when you hover on this menu link
        title = ""
    [[menu.main]]
        weight = 2
        identifier = "tags"
        pre = ""
        post = ""
        name = "Tags"
        url = "/tags/"
        title = ""
    [[menu.main]]
        weight = 3
        identifier = "categories"
        pre = ""
        post = ""
        name = "Categories"
        url = "/categories/"
        title = ""
    [[menu.main]]
        weight = 4
        identifier = "projects"
        pre = ""
        post = ""
        name = "Projects"
        url = "/projects/"
        title = ""
    [[menu.main]]
        weight = 5
        identifier = "about"
        pre = ""
        post = ""
        name = "About"
        url = "/about/"
        title = ""

# Markup related configuration in Hugo
[markup]
  # Syntax Highlighting (https://gohugo.io/content-management/syntax-highlighting)
  [markup.highlight]
    # false is a necessary configuration (https://github.com/dillonzq/LoveIt/issues/158)
    noClasses = false

# Goldmark is from Hugo 0.60 the default library used for Markdown
[markup.goldmark]

[markup.goldmark.extensions]
    definitionList = true
    footnote = true
    linkify = true
    strikethrough = true
    table = true
    taskList = true
    typographer = true

[markup.goldmark.renderer]
    # whether to use HTML tags directly in the document
    unsafe = true

# Table Of Contents settings
[markup.tableOfContents]
    startLevel = 2
    endLevel = 6
